name: BOAT RACE iPhone Update V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boat:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Capture BOAT RACE streams V3
        run: python boatrace_github.py

      - name: Show result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("boatrace_github_v3.json",encoding="utf-8"))
          ok=[(k,v.get("url","")) for k,v in d.items() if v.get("live")]
          print("LIVE:", len(ok))
          for k,u in ok:
              print(k, u[:180])
          PY

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-debug-v3
          path: boatrace_debug_v3
          if-no-files-found: ignore

      - name: Commit V3 test files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatrace_github_v3.json boatrace_github_v3.m3u
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Test BOAT RACE direct player V3"
          git push
