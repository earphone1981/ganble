name: BOAT RACE iPhone Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Capture BOAT RACE streams
        run: python boatrace_github.py

      - name: Show result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("boatrace_today.json",encoding="utf-8"))
          ok=[k for k,v in d.items() if v.get("live")]
          print("LIVE:", len(ok))
          print("\n".join(ok))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatrace_today.json IPTV/boatrace_github.m3u
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update BOAT RACE from iPhone Action"
          git push
