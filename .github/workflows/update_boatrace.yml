name: Update BOAT RACE IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 0-13 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update BOAT RACE streams
        run: python scripts/update_boatrace.py

      - name: Commit updated IPTV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update BOAT RACE streams"
          git push
